<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新都招投标信息汇总 | 新都云中台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cyan:#00f0ff; --purple:#8b5cf6; --blue:#3b82f6; --pink:#ff2d78;
  --bg:#050816; --card:rgba(13,20,45,.72); --border:rgba(0,240,255,.22);
  --text:#e6edf7; --dim:#8b9bb4;
}
body {
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  min-height:100vh; overflow-x:hidden; position:relative;
}
/* ===== 动态背景 ===== */
.bg-grid {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 70% -10%, rgba(59,130,246,.18), transparent),
    radial-gradient(ellipse 50% 40% at 10% 110%, rgba(139,92,246,.15), transparent),
    linear-gradient(rgba(0,240,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,.045) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,44px 44px,44px 44px;
  animation:gridMove 22s linear infinite;
}
@keyframes gridMove { to { background-position:0 0,0 0,0 44px,44px 0; } }
.scanline {
  position:fixed; left:0; right:0; height:120px; z-index:0; pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,240,255,.06),transparent);
  animation:scan 7s linear infinite;
}
@keyframes scan { from{top:-15%} to{top:115%} }
.particles { position:fixed; inset:0; z-index:0; pointer-events:none; }
.particles i {
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:var(--cyan); opacity:.7; box-shadow:0 0 8px var(--cyan);
  animation:float linear infinite;
}
@keyframes float {
  0% { transform:translateY(100vh) scale(.4); opacity:0; }
  12% { opacity:.9; } 88% { opacity:.9; }
  100% { transform:translateY(-8vh) scale(1); opacity:0; }
}
/* ===== 顶部 ===== */
header { position:relative; z-index:2; text-align:center; padding:54px 20px 10px; }
.sys-tag {
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; letter-spacing:4px; color:var(--cyan);
  border:1px solid var(--border); padding:6px 18px; border-radius:20px;
  background:rgba(0,240,255,.06); text-transform:uppercase;
  animation:fadeDown .8s ease both;
}
.sys-tag::before {
  content:""; width:8px; height:8px; border-radius:50%; background:var(--cyan);
  box-shadow:0 0 10px var(--cyan); animation:blink 1.6s infinite;
}
@keyframes blink { 50% { opacity:.25; } }
@keyframes fadeDown { from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:none;} }
h1 {
  margin:22px 0 10px; font-size:clamp(28px,5vw,46px); font-weight:800; letter-spacing:2px;
  background:linear-gradient(92deg,#fff 10%,var(--cyan) 45%,var(--purple) 80%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:fadeDown .9s .1s ease both;
}
.subtitle { color:var(--dim); font-size:14px; letter-spacing:1px; animation:fadeDown 1s .2s ease both; }
.subtitle b { color:var(--cyan); font-weight:600; }
/* ===== 统计卡 ===== */
.stats {
  position:relative; z-index:2; display:grid; gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  max-width:1060px; margin:34px auto 8px; padding:0 20px;
}
.stat {
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:18px 14px; text-align:center; backdrop-filter:blur(12px);
  animation:fadeUp .7s ease both; position:relative; overflow:hidden;
}
.stat::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,240,255,.09),transparent 55%);
  pointer-events:none;
}
.stat:nth-child(1){animation-delay:.25s} .stat:nth-child(2){animation-delay:.35s}
.stat:nth-child(3){animation-delay:.45s} .stat:nth-child(4){animation-delay:.55s}
@keyframes fadeUp { from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;} }
.stat .num { font-size:30px; font-weight:800; color:var(--cyan); text-shadow:0 0 18px rgba(0,240,255,.5); }
.stat:nth-child(2) .num { color:#5eead4; text-shadow:0 0 18px rgba(94,234,212,.5); }
.stat:nth-child(3) .num { color:var(--purple); text-shadow:0 0 18px rgba(139,92,246,.5); }
.stat:nth-child(4) .num { color:var(--pink); text-shadow:0 0 18px rgba(255,45,120,.5); }
.stat .label { margin-top:5px; font-size:12px; color:var(--dim); letter-spacing:2px; }
/* ===== 搜索 ===== */
.search-wrap { position:relative; z-index:2; max-width:720px; margin:26px auto 6px; padding:0 20px; }
.search-box {
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--border); border-radius:40px;
  padding:12px 20px; backdrop-filter:blur(12px);
  box-shadow:0 0 24px rgba(0,240,255,.08); transition:.3s;
}
.search-box:focus-within { border-color:rgba(0,240,255,.6); box-shadow:0 0 30px rgba(0,240,255,.2); }
.search-box svg { flex:none; opacity:.7; }
.search-box input {
  flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px;
}
.search-box input::placeholder { color:#5a6b85; }
.search-count { text-align:center; font-size:12px; color:var(--dim); margin-top:10px; letter-spacing:1px; }
.search-count b { color:var(--cyan); }
/* ===== 列表 ===== */
.list {
  position:relative; z-index:2; max-width:1060px; margin:26px auto 30px; padding:0 20px;
  display:grid; gap:18px;
}
.card {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:22px 24px; backdrop-filter:blur(12px); position:relative;
  overflow:hidden; animation:fadeUp .7s ease both; transition:.35s;
}
.card::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--cyan),var(--purple)); box-shadow:0 0 12px var(--cyan);
}
.card:hover { transform:translateY(-4px); border-color:rgba(0,240,255,.5); box-shadow:0 12px 40px rgba(0,240,255,.12); }
.card-top { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
.tag {
  font-size:11px; padding:3px 12px; border-radius:12px; letter-spacing:1px;
  border:1px solid; white-space:nowrap;
}
.tag.zb { color:#5eead4; border-color:rgba(94,234,212,.4); background:rgba(94,234,212,.08); }
.tag.zg { color:var(--pink); border-color:rgba(255,45,120,.4); background:rgba(255,45,120,.08); }
.tag.yx { color:var(--purple); border-color:rgba(139,92,246,.4); background:rgba(139,92,246,.08); }
.date { font-size:12px; color:var(--cyan); font-family:ui-monospace,monospace; letter-spacing:1px; }
.card h3 { font-size:17px; line-height:1.55; font-weight:700; margin-bottom:8px; }
.card h3 mark { background:none; color:var(--cyan); text-shadow:0 0 10px rgba(0,240,255,.55); }
.meta { display:flex; flex-wrap:wrap; gap:8px 22px; font-size:13px; color:var(--dim); margin-bottom:10px; }
.meta b { color:#b9c6dd; font-weight:600; }
.summary { font-size:13.5px; line-height:1.8; color:#aab8d0; margin-bottom:14px; }
.summary mark { background:none; color:var(--cyan); font-weight:600; }
.card-foot { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.source { font-size:12px; color:var(--dim); }
.source b { color:#8fd3ff; font-weight:600; }
.link-btn {
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  font-size:13px; color:var(--cyan); border:1px solid var(--border);
  padding:7px 16px; border-radius:20px; transition:.3s;
}
.link-btn:hover { background:rgba(0,240,255,.12); box-shadow:0 0 18px rgba(0,240,255,.35); }
/* ===== 空态 ===== */
.empty {
  display:none; text-align:center; padding:60px 0; color:var(--dim);
  position:relative; z-index:2; font-size:14px; letter-spacing:2px;
}
/* ===== 落款 ===== */
footer {
  position:relative; z-index:2; text-align:center; padding:34px 20px 46px;
  color:var(--dim); font-size:13px; letter-spacing:1px;
}
footer .brand {
  display:inline-flex; align-items:center; gap:10px; font-size:17px; font-weight:800;
  letter-spacing:5px; margin-bottom:10px;
  background:linear-gradient(92deg,var(--cyan),var(--purple));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
footer .brand::before {
  content:"◆"; font-size:12px; -webkit-text-fill-color:var(--cyan); text-shadow:0 0 10px var(--cyan);
}
footer .brand::after {
  content:"◆"; font-size:12px; -webkit-text-fill-color:var(--purple); text-shadow:0 0 10px var(--purple);
}
footer p { font-size:12px; color:#5a6b85; }
@media (max-width:600px){ .card{padding:18px 16px} .stats{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>
<div class="particles" id="particles"></div>

<header>
  <div class="sys-tag">XINDU CLOUD · INTELLIGENT BID RADAR</div>
  <h1>新都招投标信息汇总</h1>
  <div class="subtitle">数据周期：<b>2026-09-26 至 2026-10-09</b>（近两周）&nbsp;|&nbsp;关键词智能筛选：交换机 · 通信 · 网络 · 等保 · 云计算 · 大数据 · 5G · 网络安全 · 云安全 · 边缘计算 等18类</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="s-total">0</div><div class="label">信息总数</div></div>
  <div class="stat"><div class="num" id="s-zb">0</div><div class="label">招标公告</div></div>
  <div class="stat"><div class="num" id="s-zg">0</div><div class="label">中标 / 合同公示</div></div>
  <div class="stat"><div class="num" id="s-org">0</div><div class="label">客户单位</div></div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="kw" type="text" placeholder="输入关键词检索，如：网络安全、监控、医院、运维…">
  </div>
  <div class="search-count" id="count"></div>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty">NO RESULT · 未检索到相关信息</div>

<footer>
  <div class="brand">新都云中台</div>
  <p>数据来源：千里马招标网 / 中国政府采购网 / 四川政府采购网 / 客户官网</p>
  <p style="margin-top:6px">生成日期 2026-10-09 · 每周更新 · 仅限内部参考</p>
</footer>

<script>
/* 粒子背景 */
(function(){
  const box=document.getElementById('particles');
  for(let i=0;i<26;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(6+Math.random()*10)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    if(Math.random()>.6){p.style.background='#8b5cf6';p.style.boxShadow='0 0 8px #8b5cf6';}
    if(Math.random()>.8){p.style.background='#3b82f6';p.style.boxShadow='0 0 8px #3b82f6';}
    box.appendChild(p);
  }
})();

/* 数据（近两周 2026-09-26 ~ 2026-10-09） */
const DATA = [
  {title:"成都市新都区教育局城域专网运营服务采购项目政府采购合同公告",
   org:"成都市新都区教育局", type:"合同公告", typeClass:"zg", date:"2026-09-29",
   summary:"新都区教育局城域专网运营服务采购项目合同公告，涉及城域网络通信专网的运营维护服务，中标单位为中国移动通信集团成都分公司，中标金额29.88万元。",
   source:"千里马", url:"https://www.qianlima.com/bid-635268366.html",
   keys:["网络","通信","专网"]},
  {title:"成都市新都区卫生健康局2020年新都区智慧医疗及医共体信息化建设服务采购项目-2026年度运维服务竞争性磋商公告",
   org:"成都市新都区卫生健康局", type:"招标公告", typeClass:"zb", date:"2026-09-29",
   summary:"项目编号N5101142026000331，预算153.56万元，为2020年智慧医疗及医共体信息化建设项目的2026年度运维服务，服务期1年，竞争性磋商方式采购。",
   source:"中国政府采购网", url:"https://www.ccgp-sichuan.gov.cn/maincms-web/article?id=8a69d427a0e8540601a0ebf3e23701bc",
   keys:["智慧医疗","运维"]},
  {title:"成都市新都区中医医院商用密码应用安全性评估服务采购项目",
   org:"成都市新都区中医医院", type:"招标公告", typeClass:"zb", date:"2026-09-28",
   summary:"中医医院商用密码应用安全性评估服务采购，要求供应商具备商用密码检测机构资质，涉及医院信息系统密码应用合规评估。",
   source:"中国政府采购网", url:"https://www.qianlima.com/bid-635048924.html",
   keys:["商用密码","密评"]},
  {title:"西南石油大学2026年保卫处监控设备采购项目招标公告",
   org:"西南石油大学", type:"招标公告", typeClass:"zb", date:"2026-09-28",
   summary:"西南石油大学保卫处监控设备采购项目，涉及校园网络监控系统建设，预算180万元，投标截止时间10月23日。",
   source:"客户官网-西南石油大学", url:"https://www.ccgp-sichuan.gov.cn/maincms-web/article?id=8a69c2a3a0c3e92901a0ccf9d0a07fc3",
   keys:["监控","网络"]}
];

/* 高亮关键词 */
const ALL_KEYS=["交换机","通信","网络","等保","云计算","大数据","AI大模型","5G","息壤智算","量子通信","云电脑","主机托管","数据存储","灾备","网络安全","等保服务","云安全","边缘计算","智慧医疗","运维","监控","商用密码","密评","专网","信息化"];
function hl(text){
  let html=text;
  ALL_KEYS.forEach(k=>{
    if(html.includes(k)) html=html.split(k).join('⟦'+k+'⟧');
  });
  return html.replace(/⟦([^⟧]+)⟧/g,'<mark>$1</mark>');
}

/* 渲染 */
const list=document.getElementById('list');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(items){
  list.innerHTML='';
  items.forEach((r,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.style.animationDelay=(i*0.12)+'s';
    card.innerHTML=`
      <div class="card-top">
        <span class="tag ${r.typeClass}">${r.type}</span>
        <span class="date">◈ ${r.date}</span>
      </div>
      <h3>${hl(esc(r.title))}</h3>
      <div class="meta"><span>客户单位&nbsp;<b>${esc(r.org)}</b></span><span>命中关键词&nbsp;<b>${r.keys.join(' / ')}</b></span></div>
      <div class="summary">${hl(esc(r.summary))}</div>
      <div class="card-foot">
        <span class="source">来源&nbsp;<b>${esc(r.source)}</b></span>
        <a class="link-btn" href="${r.url}" target="_blank" rel="noopener">查看原文 →</a>
      </div>`;
    list.appendChild(card);
  });
  document.getElementById('count').innerHTML=`共 <b>${items.length}</b> 条信息 · 已按发布时间排序`;
}

/* 统计 */
function stats(){
  const zb=DATA.filter(r=>r.typeClass==='zb').length;
  const zg=DATA.filter(r=>r.typeClass==='zg').length;
  const orgs=new Set(DATA.map(r=>r.org)).size;
  animate('s-total',DATA.length); animate('s-zb',zb);
  animate('s-zg',zg); animate('s-org',orgs);
}
function animate(id,target){
  const el=document.getElementById(id); let cur=0;
  const step=Math.max(1,Math.ceil(target/18));
  const t=setInterval(()=>{ cur+=step; if(cur>=target){cur=target;clearInterval(t);} el.textContent=cur; },40);
}

/* 搜索 */
const kw=document.getElementById('kw');
kw.addEventListener('input',()=>{
  const q=kw.value.trim().toLowerCase();
  let items=DATA;
  if(q) items=DATA.filter(r=>(r.title+r.org+r.summary+r.type+r.keys.join('')).toLowerCase().includes(q));
  render(items);
  document.getElementById('empty').style.display=items.length?'none':'block';
});

render(DATA); stats();
</script>
</body>
</html>
